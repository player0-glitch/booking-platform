basePath: /
definitions:
  auth.emailRequest:
    properties:
      email:
        type: string
    type: object
  auth.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.passwordResetRequest:
    properties:
      email:
        type: string
      password:
        type: string
      token:
        type: string
    type: object
  auth.tokenResponse:
    properties:
      token:
        type: string
    type: object
  user.createUserRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
    type: object
  user.rolesRequest:
    properties:
      role_name:
        type: string
    type: object
  user.userRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        format: uuid
        type: string
      last_name:
        type: string
      roles:
        $ref: '#/definitions/user.rolesRequest'
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a backend service for a booking platform(not like Booking.com)
  title: Booking Platform Service
  version: "0.1"
paths:
  /auth/login:
    post:
      description: Logs in a user, adds them to a 2hr session and return jwt
      parameters:
      - description: Credentials Used For Logging In
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns token object
          schema:
            $ref: '#/definitions/auth.tokenResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorised
      summary: Login and return jwt
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: Successfully Logged out
        "401":
          description: Unauthenticated
        "500":
          description: Internal Server Error
      summary: Logout and invalidate session and token
      tags:
      - auth
  /auth/password:
    post:
      description: Reset password for any role but 'Guest'
      parameters:
      - description: Reset Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.passwordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully Updated User Password
        "403":
          description: Forbidden
      summary: Reset Recognised User Password
      tags:
      - auth
  /auth/password/reset:
    post:
      description: Request for any role but 'Guest' to request password reset token
      parameters:
      - description: Password reset credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.emailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns Raw Reset Token
          schema:
            $ref: '#/definitions/auth.tokenResponse'
        "400":
          description: Bad Request
        "403":
          description: Forbidden
      summary: Request password reset token
      tags:
      - auth
  /users:
    post:
      parameters:
      - description: User Object type
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "403":
          description: Forbidden
      summary: Create A New User
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: User Id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Delete user by id
      tags:
      - users
    get:
      parameters:
      - description: User Id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/user.userRequest'
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Retrieve user by id
      tags:
      - users
  /users/{id}/soft:
    delete:
      parameters:
      - description: User Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.userRequest'
        "204":
          description: No Content
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Solf delete user by id
      tags:
      - users
  /users/{rolename}:
    get:
      parameters:
      - description: Role Name
        in: path
        name: rolename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get Users by role
      tags:
      - users
  /users/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
      summary: Retrieve All Users
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Enter your JWT as: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
